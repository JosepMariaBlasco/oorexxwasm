# The npm package oorexxwasm (scripts/npm-package.sh): built from the Node
# command-line build, installed with `npm install -g` on Linux, macOS and
# Windows and checked there (npm/test/smoke.rex, js-proxy.rex,
# js-extend.rex), and, for a tag vX.Y.Z, staged on npm for approval.
#
# Publishing uses npm's trusted publishing: npmjs.com is told, once, that
# oorexxwasm is published from this repository by this workflow, and the job
# proves who it is with GitHub's OIDC token (no npm token is stored here).
# The trusted publisher is stage-only: the job runs `npm stage publish`, the
# version waits in npm's stage queue, and a maintainer approves it (with
# 2FA) on npmjs.com or with the npm CLI; only then can it be installed.
#
# On demand (Actions > release > Run workflow) it builds and checks the
# package; with "publish" it also stages it, and tags the commit vX.Y.Z.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version (X.Y.Z; for a check only, anything)
        default: 0.0.0-test
      publish:
        description: Stage it on npm for approval, and tag the commit vX.Y.Z
        type: boolean
        default: false

permissions:
  contents: read

env:
  EMVER: "6.0.12"

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ORX_WASM_WORK: ${{ github.workspace }}/..
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then v=${GITHUB_REF#refs/tags/v}; else v=${{ inputs.version }}; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Tools (svn)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion
      - name: Emscripten cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/../emsdk
          key: emsdk-${{ env.EMVER }}-${{ runner.os }}
      - name: Set up (saved build, or compile)
        run: scripts/setup-env.sh
      - name: Package
        run: |
          scripts/npm-package.sh "${{ steps.version.outputs.version }}" "$ORX_WASM_WORK/build-wasm/bin-node" "$RUNNER_TEMP/npm"
          mkdir -p "$RUNNER_TEMP/npm/tests"
          cp npm/test/smoke.rex "$ORX_WASM_WORK"/oorexx/wasm/tests/js-proxy.rex "$ORX_WASM_WORK"/oorexx/wasm/tests/js-extend.rex "$RUNNER_TEMP/npm/tests/"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: |
            ${{ runner.temp }}/npm/oorexxwasm-*.tgz
            ${{ runner.temp }}/npm/tests/

  check:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash             # with -o pipefail; and the counts are checked, not only the status
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: pkg
      - name: Install (npm install -g)
        run: npm install -g ./pkg/oorexxwasm-*.tgz
      - name: rexx -v, and the -wasm names
        run: rexx -v && rexx-wasm -e 'say .RexxInfo~platform' | tr -d '\r' | grep -qx EMSCRIPTEN
      - name: Smoke test
        run: mkdir scratch && cd scratch && rexx ../pkg/tests/smoke.rex | tee ../smoke.log && tr -d '\r' < ../smoke.log | grep -q ' 0 failed$'
      - name: Rexx objects in JavaScript (js-proxy.rex)
        run: cd scratch && rexx ../pkg/tests/js-proxy.rex | tee ../proxy.log && tr -d '\r' < ../proxy.log | grep -q '^28 passed, 0 failed$'
      - name: Rexx classes extending JavaScript classes (js-extend.rex)
        run: cd scratch && rexx ../pkg/tests/js-extend.rex | tee ../extend.log && tr -d '\r' < ../extend.log | grep -q '^31 passed, 0 failed$'

  publish:
    needs: [package, check]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    runs-on: ubuntu-24.04
    permissions:
      contents: write           # the tag vX.Y.Z (when run on demand)
      id-token: write           # npm's trusted publishing (OIDC)
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing and staging (11.15 or later)
        run: npm install -g npm@latest && npm --version
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: pkg
      - name: Stage for approval
        run: npm stage publish ./pkg/oorexxwasm-*.tgz --access public
      - name: Tag the commit
        if: "!startsWith(github.ref, 'refs/tags/')"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.package.outputs.version }}
        run: gh api repos/${{ github.repository }}/git/refs -f ref="refs/tags/$TAG" -f sha="${{ github.sha }}"
